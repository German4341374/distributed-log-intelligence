[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "distributed-log-intelligence"
version = "0.1.0"
description = "Streaming CLI for analyzing logs from distributed applications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "German4341374" }]
keywords = ["logs", "observability", "cli", "incident-response", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Logging",
]
dependencies = [
  "pydantic==2.13.4",
  "rich==15.0.0",
  "typer==0.27.0",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[project.scripts]
distributed-log-intelligence = "distributed_log_intelligence.cli:app"
dli = "distributed_log_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_log_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["distributed_log_intelligence"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=distributed_log_intelligence --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
