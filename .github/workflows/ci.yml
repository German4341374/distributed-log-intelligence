name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src benchmarks

      - name: Run tests with coverage
        run: uv run pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build wheel and source distribution
        run: uv build

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run small benchmark
        run: uv run python benchmarks/run_benchmark.py --sizes 1000 10000 --repeats 1 --json > benchmark.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-smoke
          path: benchmark.json
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --target runtime --tag distributed-log-intelligence:ci .

      - name: Verify non-root runtime and CLI
        run: |
          test "$(docker run --rm --entrypoint id distributed-log-intelligence:ci -u)" != "0"
          docker run --rm --network none distributed-log-intelligence:ci --version

